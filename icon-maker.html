<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon maker — ض tile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap">
<style>
body{font:16px/1.5 system-ui,sans-serif;margin:1rem auto;padding:0 1rem;max-width:44rem}
select,input,button{font:inherit;padding:.5rem .7rem;margin:.25rem 0}button{border:0;border-radius:.5rem;background:#b45309;color:#fff}
.row{display:flex;gap:1rem;flex-wrap:wrap}.card{text-align:center}canvas{width:150px;height:150px;background:#ddd;border-radius:8px}
</style></head><body>
<h1>Icon maker (ض)</h1>
<p>Draws the emerald-and-gold tile icon with the font you choose, then downloads the PNGs. Put the downloaded files in the <code>icons/</code> folder (same names) and redeploy.</p>
<label>Font:
<select id="font"><option value="Traditional Arabic">Traditional Arabic (only if installed on this device)</option><option value="Amiri" selected>Amiri (web font, loads online)</option><option value="custom">Custom font file…</option></select></label><br>
<input type="file" id="file" accept=".ttf,.otf,.woff,.woff2" hidden>
<label>Letter size: <input type="range" id="scale" min="70" max="140" value="105"></label><br>
<button id="go">Draw preview</button> <button id="all">Download all 5 PNGs</button>
<div class="row" id="previews"></div>
<script>
const SPECS=[['icon-192.png',192,'any'],['icon-512.png',512,'any'],['icon-maskable-192.png',192,'maskable'],['icon-maskable-512.png',512,'maskable'],['apple-touch-icon.png',180,'apple']];
const $=id=>document.getElementById(id);const LETTER='ض';
let family='Amiri';
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
async function useFont(){
  const v=$('font').value;
  if(v==='custom'){const f=$('file').files[0];if(!f){$('file').click();throw new Error('choose a font file first')}
    const ff=new FontFace('UserFont',await f.arrayBuffer());await ff.load();document.fonts.add(ff);family='UserFont'}
  else{family=v;if(v==='Amiri')await document.fonts.load('700 100px Amiri',LETTER)}
}
function draw(S,kind){
  const cv=document.createElement('canvas');cv.width=cv.height=S;const c=cv.getContext('2d');
  const GOLD='#d9b45a',GOLD_L='#f6e0a0',GOLD_D='#967024';
  // emerald background
  let g=c.createRadialGradient(S/2,S*.44,0,S/2,S*.44,S*.78);g.addColorStop(0,'#107048');g.addColorStop(1,'#042016');c.fillStyle=g;c.fillRect(0,0,S,S);
  // star lattice, visible only toward the rim
  const p=document.createElement('canvas');p.width=p.height=S;const q=p.getContext('2d');
  const cell=S/5,r=cell*.46,rd=r*Math.SQRT2;q.strokeStyle=GOLD;q.lineWidth=Math.max(1,S/430);
  for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const x=(i+.5)*cell,y=(j+.5)*cell;q.strokeRect(x-r,y-r,2*r,2*r);
    q.beginPath();q.moveTo(x,y-rd);q.lineTo(x+rd,y);q.lineTo(x,y+rd);q.lineTo(x-rd,y);q.closePath();q.stroke()}
  q.globalCompositeOperation='destination-in';g=q.createRadialGradient(S/2,S*.44,0,S/2,S*.44,S*.78);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.28,'rgba(0,0,0,0)');g.addColorStop(.83,'rgba(0,0,0,.3)');g.addColorStop(1,'rgba(0,0,0,.3)');
  q.fillStyle=g;q.fillRect(0,0,S,S);c.drawImage(p,0,0);
  if(kind==='any'){ // gold double frame + diamonds
    c.strokeStyle=GOLD;c.lineWidth=S*.011;rr(c,S*.042,S*.042,S*.916,S*.916,S*.13);c.stroke();
    c.strokeStyle='rgba(246,224,160,.6)';c.lineWidth=S*.0035;rr(c,S*.074,S*.074,S*.852,S*.852,S*.10);c.stroke();
    const m=S*.042,dm=S*.022;c.fillStyle=GOLD_L;c.strokeStyle=GOLD_D;c.lineWidth=Math.max(1,S/500);
    [[S/2,m],[S/2,S-m],[m,S/2],[S-m,S/2]].forEach(([x,y])=>{c.beginPath();c.moveTo(x,y-dm);c.lineTo(x+dm,y);c.lineTo(x,y+dm);c.lineTo(x-dm,y);c.closePath();c.fill();c.stroke()})}
  const t=S*(kind==='any'?.60:.54),x0=(S-t)/2,y0=(S-t)/2-S*.010,rad=t*.17;
  c.save();c.shadowColor='rgba(0,0,0,.72)';c.shadowBlur=S*.05;c.shadowOffsetY=t*.07;c.fillStyle='#000';rr(c,x0,y0,t,t,rad);c.fill();c.restore();
  g=c.createLinearGradient(0,y0,0,y0+t*1.05);g.addColorStop(0,GOLD_L);g.addColorStop(1,GOLD_D);c.fillStyle=g;rr(c,x0,y0+t*.01,t,t+t*.05,rad);c.fill();
  g=c.createLinearGradient(0,y0,0,y0+t);g.addColorStop(0,'#fffbf0');g.addColorStop(1,'#eee1be');c.fillStyle=g;rr(c,x0,y0,t,t,rad);c.fill();
  c.strokeStyle='rgba(255,255,248,.9)';c.lineWidth=Math.max(1,S/320);rr(c,x0,y0,t,t,rad);c.stroke();
  let i1=t*.058;c.strokeStyle=GOLD;c.lineWidth=Math.max(1,S/300);rr(c,x0+i1,y0+i1,t-2*i1,t-2*i1,rad*.72);c.stroke();
  i1=t*.085;c.strokeStyle='rgba(217,180,90,.45)';c.lineWidth=Math.max(1,S/620);rr(c,x0+i1,y0+i1,t-2*i1,t-2*i1,rad*.62);c.stroke();
  // letter: fit inside the tile, centre on its ink box, emerald gradient + engraved highlight
  c.textAlign='left';c.textBaseline='alphabetic';let fs=t*1.12,m;
  for(let k=0;k<60;k++){c.font=`700 ${fs}px "${family}", serif`;m=c.measureText(LETTER);
    if((m.actualBoundingBoxRight+m.actualBoundingBoxLeft)<=t*.68&&(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent)<=t*.64)break;fs*=.97}
  const sc=$('scale').value/100;if(sc!==1){fs*=sc;c.font=`700 ${fs}px "${family}", serif`;m=c.measureText(LETTER)}
  const x=S/2-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2,y=y0+t/2+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
  c.fillStyle='rgba(255,255,255,.8)';c.fillText(LETTER,x+t*.010,y+t*.014);
  g=c.createLinearGradient(0,y-m.actualBoundingBoxAscent,0,y+m.actualBoundingBoxDescent);g.addColorStop(0,'#0e7048');g.addColorStop(1,'#053422');c.fillStyle=g;c.fillText(LETTER,x,y);
  if(kind==='any'){c.globalCompositeOperation='destination-in';rr(c,0,0,S,S,S*.21);c.fillStyle='#000';c.fill()}
  return cv;
}
async function render(){await useFont();const box=$('previews');box.innerHTML='';
  for(const [name,S,kind] of SPECS){const cv=draw(S,kind);cv.dataset.name=name;const d=document.createElement('div');d.className='card';
    d.appendChild(cv);const p=document.createElement('div');p.textContent=name;d.appendChild(p);box.appendChild(d)}}
function save(cv){return new Promise(res=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cv.dataset.name;a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);res()},400)},'image/png'))}
$('go').onclick=()=>render().catch(e=>alert(e.message));
$('all').onclick=async()=>{try{await render();for(const cv of document.querySelectorAll('#previews canvas'))await save(cv)}catch(e){alert(e.message)}};
$('font').onchange=()=>{if($('font').value==='custom')$('file').click()};$('file').onchange=()=>render().catch(()=>{});
render().catch(()=>{});
</script></body></html>
